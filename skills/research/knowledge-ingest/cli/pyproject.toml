[project]
name = "kb"
version = "0.1.0"
description = "Read-only validation for knowledge-ingest bundles: structure, coverage, duplicates, quotes, citers, sync simulation"
requires-python = ">=3.10"
dependencies = ["typer>=0.12,<1"]

[project.scripts]
kb = "kb.cli:entry"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
